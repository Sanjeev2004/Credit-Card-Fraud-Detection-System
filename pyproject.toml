[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Reproducible four-model fraud benchmark and batch/API inference"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4", "lightgbm>=4.5,<5", "joblib>=1.4,<2",
  "matplotlib>=3.9,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "httpx>=0.27,<1", "kagglehub>=0.3,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "ipython>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_detection = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
